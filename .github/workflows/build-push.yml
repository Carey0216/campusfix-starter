name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate image version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^v[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/carey0216/campusfix:${{ github.sha }}
            ghcr.io/carey0216/campusfix:${{ steps.version.outputs.value }}
            ghcr.io/carey0216/campusfix:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Carey0216/campusfix-starter
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published image digest=$IMAGE_DIGEST"
