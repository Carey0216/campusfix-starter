name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 跑测试
        run: python -m pytest
